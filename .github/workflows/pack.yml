name: Pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish to GitHub Packages and nuget.org
        required: false
        default: "13.5.0-preview.1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${TAG_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "Package version is empty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack IntrepidDeveloper.Aspire.Hosting.Railway.slnx
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts

      - name: Push
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          packages=()
          for pkg in artifacts/*.nupkg; do
            [[ "$pkg" == *.symbols.nupkg ]] && continue
            packages+=("$pkg")
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No nupkg files to push" >&2
            exit 1
          fi

          # gh release create writes a v* tag, which retriggers this workflow.
          # GitHub Packages returns 409 Conflict for a version that is already
          # published; treat that as success so a duplicate pack cannot fail
          # the job, then still ensure the GitHub Release exists.
          set +e
          output="$(dotnet nuget push "${packages[@]}" \
            --source https://nuget.pkg.github.com/intrepid-developer/index.json \
            --api-key "$NUGET_AUTH_TOKEN" \
            --skip-duplicate 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s\n' "$output" | grep -qiE '409|Conflict'; then
              echo "Version already on GitHub Packages (409 Conflict); continuing."
            else
              exit "$status"
            fi
          fi

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Intrepid-Developer

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=()
          for pkg in artifacts/*.nupkg; do
            [[ "$pkg" == *.symbols.nupkg ]] && continue
            packages+=("$pkg")
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No nupkg files to push" >&2
            exit 1
          fi

          # nuget.org returns 409 / already-published for a version that is
          # already on the feed; --skip-duplicate and an explicit 409 /
          # already-published fallback treat that as success so a re-pack
          # of the same version cannot fail the job.
          set +e
          output="$(dotnet nuget push "${packages[@]}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s\n' "$output" | grep -qiE '409|Conflict|already|duplicate'; then
              echo "Version already on nuget.org; continuing."
            else
              exit "$status"
            fi
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping create."
            exit 0
          fi

          notes_file="$(mktemp)"
          {
            awk -v ver="$VERSION" '
              { sub(/\r$/, "") }
              BEGIN { heading = "## " ver }
              $0 == heading { found = 1 }
              found && $0 ~ /^## / && $0 != heading { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "Packages are on nuget.org and GitHub Packages: https://nuget.pkg.github.com/intrepid-developer/index.json"
          } > "$notes_file"

          if ! tr -d '\r' < CHANGELOG.md | grep -Fxq "## ${VERSION}"; then
            echo "No ## ${VERSION} section in CHANGELOG.md; notes will only mention nuget.org and GitHub Packages." >&2
          fi

          echo "Release notes:"
          cat "$notes_file"

          args=(--title "$VERSION" --notes-file "$notes_file" --target "$TARGET")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          if ! gh release create "$tag" "${args[@]}"; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; skipping create."
              exit 0
            fi
            exit 1
          fi
