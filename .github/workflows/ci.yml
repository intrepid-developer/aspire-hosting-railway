name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IntrepidDeveloper.Aspire.Hosting.Railway.slnx

      - name: Build
        run: dotnet build IntrepidDeveloper.Aspire.Hosting.Railway.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test IntrepidDeveloper.Aspire.Hosting.Railway.slnx --no-build --configuration Release --verbosity normal
